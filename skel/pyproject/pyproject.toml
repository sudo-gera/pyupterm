[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyupterm"
version = "0.24.0.1"
description = "Unofficial upterm wrapper"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Gera" }
]
dependencies = []

[project.scripts]
pyupterm = "pyupterm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyupterm"]

[tool.hatch.build.targets.wheel.force-include]
"src/pyupterm/data" = "pyupterm/data"
